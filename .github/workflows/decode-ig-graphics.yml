name: Decode Instagram graphics
on:
  push:
    paths:
      - "social/*.png.b64"
permissions:
  contents: write
jobs:
  decode:
    if: github.repository == 'cazzam15/Ainofluff'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Decode graphics and remove helpers
        run: |
          python3 << 'PY'
          import base64
          from pathlib import Path
          social = Path("social")
          for b64 in sorted(social.glob("*.png.b64")):
              dest = b64.with_name(b64.name[:-4])
              dest.write_bytes(base64.b64decode(b64.read_text()))
              b64.unlink()
              print(f"wrote {dest} ({dest.stat().st_size} bytes)")
          tiny = social / "_tiny-test.png"
          if tiny.exists():
              tiny.unlink()
              print("removed social/_tiny-test.png")
          wf = Path(".github/workflows/decode-ig-graphics.yml")
          if wf.exists():
              wf.unlink()
              print("removed", wf)
          PY
      - name: Commit decoded PNGs
        run: |
          git config user.name "cazzam15"
          git config user.email "223236672+cazzam15@users.noreply.github.com"
          git add -A social .github
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Add rendered Instagram graphics for 25-29 Nov 2026"
          git push
