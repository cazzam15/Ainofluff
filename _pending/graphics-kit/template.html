<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:'Inter';font-weight:100 900;src:url('fonts/Inter.woff2') format('woff2')}
@font-face{font-family:'Space Grotesk';font-weight:300 700;src:url('fonts/SpaceGrotesk.woff2') format('woff2')}
:root{--bg:#0F1117;--teal:#1D9E75;--text:#F5F5F0;--muted:#888780;--line:#1F2430}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;background:var(--bg);overflow:hidden}
body{font-family:'Inter',sans-serif;color:var(--text);padding:104px 96px 88px;display:flex;flex-direction:column}
main{flex:1;display:flex;flex-direction:column;justify-content:center}
h1{font-family:'Space Grotesk',sans-serif;font-size:88px;font-weight:600;line-height:1.04;letter-spacing:-0.03em;max-width:880px}
h1 span{color:var(--teal)}
.facts{margin-top:72px;display:flex;flex-direction:column;gap:28px}
.facts p{font-size:40px;line-height:1.3;padding-left:32px;border-left:6px solid var(--teal)}
footer{display:flex;justify-content:space-between;align-items:flex-end;gap:48px;padding-top:40px;border-top:2px solid var(--line)}
.mark{font-family:'Space Grotesk',sans-serif;font-size:46px;font-weight:600;letter-spacing:-0.02em;line-height:1}
.mark span{color:var(--teal)}
.src{font-size:24px;color:var(--muted);text-align:right;line-height:1.4;max-width:680px}
</style></head><body>
<main>
  <h1>{{HEADLINE}}</h1>
  <div class="facts">{{LINES}}</div>
</main>
<footer><div class="mark">ai<span>nofluff</span></div><p class="src">{{SOURCE}}</p></footer>
</body></html>
